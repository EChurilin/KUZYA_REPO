services:
  postgres:
    image: postgres:16-alpine
    container_name: kizya_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./migrations/002_staff_features.sql:/docker-entrypoint-initdb.d/01_002_staff_features.sql:ro
      - ./migrations/003_balance_and_gifts.sql:/docker-entrypoint-initdb.d/02_003_balance_and_gifts.sql:ro
      - ./migrations/004_fix_deactivated_at_tz.sql:/docker-entrypoint-initdb.d/03_004_fix_deactivated_at_tz.sql:ro
      - ./migrations/005_moderation_message_ids.sql:/docker-entrypoint-initdb.d/04_005_moderation_message_ids.sql:ro
      - ./migrations/006_session_cooldown.sql:/docker-entrypoint-initdb.d/05_006_session_cooldown.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kizya_network

  redis:
    image: redis:7-alpine
    container_name: kizya_bot_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kizya_network

  client_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kizya_bot_client
    restart: unless-stopped
    environment:
      BOT_TYPE: client
      CLIENT_BOT_TOKEN: ${CLIENT_BOT_TOKEN}
      STAFF_BOT_TOKEN: ${STAFF_BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_PATH: /app/storage/screenshots
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kizya_network

  staff_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kizya_bot_staff
    restart: unless-stopped
    environment:
      BOT_TYPE: staff
      CLIENT_BOT_TOKEN: ${CLIENT_BOT_TOKEN}
      STAFF_BOT_TOKEN: ${STAFF_BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_PATH: /app/storage/screenshots
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kizya_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kizya_network:
    driver: bridge